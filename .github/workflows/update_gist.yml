
name: Update Clash Config Gist

on:
  push:
    branches:
      - main
    paths:
      - 'config.yaml'
      - 'patch/override.yaml'
      - 'patch/providers.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_update_gist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-crypt python3-yaml

      - name: Unlock encrypted files
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "$GIST_ID" ]; then
            echo "::error::GIST_ID secret is not set."
            exit 1
          fi

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          python3 scripts/git-crypt-key "$KEY_FILE"
          git-crypt unlock "$KEY_FILE"

          echo "Encrypted files unlocked successfully."

      - name: Merge configuration
        run: |
          python3 scripts/merge \
            config.yaml \
            patch/providers.yaml \
            patch/override.yaml \
            output.yaml

          if [ ! -s output.yaml ]; then
            echo "::error::output.yaml is missing or empty."
            exit 1
          fi

          echo "output.yaml created successfully."

      - name: Get latest mihomo version
        id: get_version
        run: |
          VERSION_TAG="$(
            curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest |
            jq -er '.tag_name'
          )"

          if [ -z "$VERSION_TAG" ]; then
            echo "::error::Could not determine mihomo version."
            exit 1
          fi

          echo "Latest mihomo version: $VERSION_TAG"
          echo "VERSION_TAG=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Get cache month
        id: cache_month
        run: |
          echo "MONTH=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      - name: Cache mihomo package
        id: cache_mihomo
        uses: actions/cache@v4
        with:
          path: /tmp/mihomo.deb
          key: ${{ runner.os }}-mihomo-${{ steps.get_version.outputs.VERSION_TAG }}

      - name: Cache mihomo working directory
        id: cache_workdir
        uses: actions/cache@v4
        with:
          path: /tmp/mihomo
          key: ${{ runner.os }}-mihomo-data-${{ steps.cache_month.outputs.MONTH }}

      - name: Download mihomo if not cached
        if: steps.cache_mihomo.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss. Downloading mihomo..."

          DEB_URL="$(
            curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest |
            jq -r '
              [
                .assets[]
                | select(.name | contains("linux-amd64-v3") and endswith(".deb"))
              ]
              | first
              | .browser_download_url // empty
            '
          )"

          if [ -z "$DEB_URL" ]; then
            echo "::error::Could not find mihomo linux-amd64-v3 package."
            exit 1
          fi

          wget -q -O /tmp/mihomo.deb "$DEB_URL"

          if [ ! -s /tmp/mihomo.deb ]; then
            echo "::error::Downloaded mihomo package is empty."
            exit 1
          fi

      - name: Install mihomo
        run: |
          sudo apt-get install -y /tmp/mihomo.deb
          mkdir -p /tmp/mihomo

      - name: Validate configuration
        run: |
          echo "Validating output.yaml..."

          mihomo -t -d /tmp/mihomo -f output.yaml

          echo "Configuration check passed."

      - name: Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_FILENAME: ${{ secrets.GIST_FILENAME }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GIST_PAT secret is not set."
            exit 1
          fi

          if [ -z "$GIST_ID" ]; then
            echo "::error::GIST_ID secret is not set."
            exit 1
          fi

          if [ -z "$GIST_FILENAME" ]; then
            echo "::error::GIST_FILENAME secret is not set."
            exit 1
          fi

          {
            echo "# =========================================="
            echo "# 更新时间: $(TZ='Asia/Shanghai' date -d "@$(git log -1 --format='%ct')" '+%Y-%m-%d %H:%M:%S') (UTC+8)"
            echo "# 提交信息: $(git log -1 --format='%s')"
            echo "# =========================================="
            echo ""
            cat output.yaml
          } > final_config.yaml

          mv final_config.yaml "$GIST_FILENAME"

          echo "Updating Gist: $GIST_ID"

          gh gist edit "$GIST_ID" "$GIST_FILENAME"

          echo "Gist updated successfully."
